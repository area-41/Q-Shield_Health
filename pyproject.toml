[project]
name = "qshield"
version = "1.0.0"
description = "Post-Quantum Genomic Data Security Framework via ML-KEM Hybrid Envelope Encryption"
readme = "README.md"
authors = [{ name = "Area-41 Security Research" }]
requires-python = ">=3.12, <3.14"
dependencies = [
    "cryptography>=42.0.0",
    "kyber-py>=0.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "psutil>=5.9.0",
]

[project.scripts]
qshield = "qshield.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true